name: Prepare SPOTIZON source and build APK

on:
  push:
    paths:
      - 'SPOTIZON-V1.0.0-ANDROID-SOURCE.zip'
      - '.github/workflows/prepare-spotizon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify uploaded source archive
        run: |
          test -f "SPOTIZON-V1.0.0-ANDROID-SOURCE.zip"
          unzip -t "SPOTIZON-V1.0.0-ANDROID-SOURCE.zip"
          mkdir -p /tmp/spotizon-source
          unzip -q "SPOTIZON-V1.0.0-ANDROID-SOURCE.zip" -d /tmp/spotizon-source
          test -f /tmp/spotizon-source/android-native/app/build.gradle.kts
          test -f /tmp/spotizon-source/vercel.json
          test -f /tmp/spotizon-source/index.html
          echo "Source archive verified."

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build SPOTIZON debug APK
        working-directory: /tmp/spotizon-source/android-native
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPOTIZON-debug-apk
          path: /tmp/spotizon-source/android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
