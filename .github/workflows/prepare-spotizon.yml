name: Prepare SPOTIZON source and build APK

on:
  push:
    paths:
      - 'SPOTIZON-V1.0.0-ANDROID-SOURCE.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract SPOTIZON project into repository root
        run: |
          if [ ! -f "SPOTIZON-V1.0.0-ANDROID-SOURCE.zip" ]; then
            echo "Upload SPOTIZON-V1.0.0-ANDROID-SOURCE.zip to the repository root first."
            exit 1
          fi
          mkdir -p /tmp/spotizon-source
          unzip -q SPOTIZON-V1.0.0-ANDROID-SOURCE.zip -d /tmp/spotizon-source
          cp -a /tmp/spotizon-source/. .
          rm -f SPOTIZON-V1.0.0-ANDROID-SOURCE.zip
          test -f android-native/app/build.gradle.kts
          test -f vercel.json
          test -f index.html

      - name: Commit extracted source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add SPOTIZON music app and Vercel backend source"
            git push
          else
            echo "No source changes to commit."
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build SPOTIZON debug APK
        working-directory: android-native
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPOTIZON-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
